apiVersion: v1
kind: ConfigMap
metadata:
  name: suanet-frontend-monitoring
  namespace: suanet-dev
  labels:
    app: suanet-frontend
data:
  # Monitoring configuration
  monitoring.json: |
    {
      "alerts": {
        "memory_threshold": 450,
        "cpu_threshold": 80,
        "response_time_threshold": 5000,
        "error_rate_threshold": 5
      },
      "metrics": {
        "collection_interval": 30,
        "retention_period": "7d"
      }
    }
  
  # Logging configuration  
  logging.json: |
    {
      "level": "info",
      "format": "json",
      "outputs": ["stdout"],
      "fields": {
        "service": "suanet-frontend",
        "version": "1.152",
        "environment": "dev"
      }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: suanet-frontend-monitoring-service
  namespace: suanet-dev
  labels:
    app: suanet-frontend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/api/health"
spec:
  selector:
    app: suanet-frontend
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
