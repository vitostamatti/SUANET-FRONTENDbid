# Azure DevOps Pipeline - SUANET Frontend Production
# Triggers on commits to 'prd' branch
# Deploys to: suanet-prd namespace in aks-suanet-atulaa-prd
# Registry: acrsuanetatulaaprd.azurecr.io

trigger:
  branches:
    include:
      - prd

pr: none

pool:
  vmImage: ubuntu-latest

variables:
- group: suanet-frontend-secrets-prd
- name: azureSubscription
  value: 'SCSuanet-AtulaaPrd'
- name: resourceGroupName
  value: 'RG-SDM-SUANET-PRD'
- name: aksName
  value: 'aks-suanet-atulaa-prd'
- name: acrName
  value: 'acrsuanetatulaaprd'
- name: location
  value: 'eastus'
- name: namespace
  value: 'suanet-prd'

stages:
# =============================================================================
# STAGE 1: BUILD - Construir y pushear imagen Docker
# =============================================================================
- stage: Build
  displayName: 'Build Docker Image'
  jobs:
  - job: BuildImage
    displayName: 'Build and Push Docker Image'
    steps:
    - task: AzureCLI@2
      displayName: 'Get AKS Credentials and ACR Login'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Get AKS credentials
          az aks get-credentials --resource-group $(resourceGroupName) --name $(aksName) --admin

          # Login to ACR
          az acr login --name $(acrName)

    - script: |
        echo "BACKEND_URL=$(BACKEND_URL)" > .env.production
        echo "NEXT_PUBLIC_BACKEND_URL=$(NEXT_PUBLIC_BACKEND_URL)" >> .env.production
        echo "NEXT_PUBLIC_FRONTEND_URL=$(NEXT_PUBLIC_FRONTEND_URL)" >> .env.production
        echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=$(NEXT_PUBLIC_GOOGLE_CLIENT_ID)" >> .env.production
        echo "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$(NEXT_PUBLIC_GOOGLE_MAPS_API_KEY)" >> .env.production
        echo "NEXTAUTH_SECRET=$(NEXTAUTH_SECRET)" >> .env.production
        echo "NEXT_PUBLIC_POWERBI_DESCRIPTIVO_URL=$(NEXT_PUBLIC_POWERBI_DESCRIPTIVO_URL)" >> .env.production
        echo "NEXT_PUBLIC_POWERBI_TRAFICO_URL=$(NEXT_PUBLIC_POWERBI_TRAFICO_URL)" >> .env.production
        echo "NODE_ENV=$(NODE_ENV)" >> .env.production
        echo "PORT=$(PORT)" >> .env.production

        echo "Environment variables configured:"
        cat .env.production | grep -v 'SECRET\|API_KEY'

        # Create frontend-env for Kubernetes secret
        cat .env.production | grep -v '^#' | grep -v '^$' > frontend-env
      displayName: 'Generate Environment Files'

    - script: |
        # Generar tag automático con formato: 1.YYYYMMDD.BuildId
        # Ejemplo: 1.20251107.55368
        DATE_TAG=$(date +%Y%m%d)
        BUILD_ID=$(Build.BuildId)
        IMAGE_TAG="1.${DATE_TAG}.${BUILD_ID}"
        VERSION_LABEL="1.${BUILD_ID}"

        # Compartir variables entre stages usando isOutput=true
        echo "##vso[task.setvariable variable=imageTag;isOutput=true]$IMAGE_TAG"
        echo "##vso[task.setvariable variable=versionLabel;isOutput=true]$VERSION_LABEL"

        echo "=========================================="
        echo "Auto-generated Version for PRODUCTION"
        echo "=========================================="
        echo "Build ID:      $BUILD_ID"
        echo "Date:          $DATE_TAG"
        echo ""
        echo "Generated Tags:"
        echo "Image Tag:     $IMAGE_TAG"
        echo "Version Label: $VERSION_LABEL"
        echo ""
        echo "Environment:   prd"
        echo "ACR:           $(acrName)"
        echo "Repository:    suanet-frontend-prd"
        echo "=========================================="
      name: setVersion
      displayName: 'Generate Version Tag'

    - script: |
        IMAGE_TAG=$(setVersion.imageTag)
        echo "=========================================="
        echo "Building Docker Image"
        echo "=========================================="
        echo "Registry: $(acrName).azurecr.io"
        echo "Image: suanet-frontend-prd"
        echo "Tag: $IMAGE_TAG"
        echo "Also tagging as: latest"
        echo "=========================================="

        docker buildx build \
          --platform linux/amd64 \
          --load \
          -f Dockerfile-prd \
          --build-arg APP_VERSION="$IMAGE_TAG" \
          --build-arg NEXT_PUBLIC_BACKEND_URL="$(NEXT_PUBLIC_BACKEND_URL)" \
          --build-arg NEXT_PUBLIC_FRONTEND_URL="$(NEXT_PUBLIC_FRONTEND_URL)" \
          --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="$(NEXT_PUBLIC_GOOGLE_CLIENT_ID)" \
          --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$(NEXT_PUBLIC_GOOGLE_MAPS_API_KEY)" \
          --build-arg NEXT_PUBLIC_POWERBI_DESCRIPTIVO_URL="$(NEXT_PUBLIC_POWERBI_DESCRIPTIVO_URL)" \
          --build-arg NEXT_PUBLIC_POWERBI_TRAFICO_URL="$(NEXT_PUBLIC_POWERBI_TRAFICO_URL)" \
          -t $(acrName).azurecr.io/suanet-frontend-prd:$IMAGE_TAG \
          -t $(acrName).azurecr.io/suanet-frontend-prd:latest \
          .

        echo "✓ Docker image built successfully"
      displayName: 'Build Docker Image'

    - script: |
        IMAGE_TAG=$(setVersion.imageTag)
        echo "=========================================="
        echo "Pushing Docker Image to ACR"
        echo "=========================================="
        echo "Pushing versioned tag: $IMAGE_TAG"
        docker push $(acrName).azurecr.io/suanet-frontend-prd:$IMAGE_TAG

        echo "Pushing latest tag"
        docker push $(acrName).azurecr.io/suanet-frontend-prd:latest

        echo "✓ Docker images pushed successfully"
      displayName: 'Push Docker Image to ACR'

    - publish: $(System.DefaultWorkingDirectory)/frontend-env
      artifact: frontend-env
      displayName: 'Publish frontend-env artifact'

# =============================================================================
# STAGE 2: DEPLOY PRD - Desplegar a producción
# =============================================================================
- stage: DeployPrd
  displayName: 'Deploy to Production'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'prd'))
  variables:
  - name: imageTag
    value: $[ stageDependencies.Build.BuildImage.outputs['setVersion.imageTag'] ]
  - name: versionLabel
    value: $[ stageDependencies.Build.BuildImage.outputs['setVersion.versionLabel'] ]
  jobs:
  - job: DeployPrdJob
    displayName: 'Deploy to suanet-prd Namespace'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - download: current
      artifact: frontend-env
      displayName: 'Download frontend-env artifact'

    - task: AzureCLI@2
      displayName: 'Deploy to AKS Production'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=========================================="
          echo "SUANET Frontend - Production Deployment"
          echo "=========================================="
          echo "Environment: suanet-prd"
          echo "AKS Cluster: $(aksName)"
          echo "Image Tag: $(imageTag)"
          echo "Version Label: $(versionLabel)"
          echo "=========================================="

          # Get AKS credentials
          echo "Getting AKS credentials..."
          az aks get-credentials --resource-group $(resourceGroupName) --name $(aksName) --admin --overwrite-existing

          # Setup ACR Secret
          echo ""
          echo "=========================================="
          echo "Setting up ACR Secret..."
          echo "=========================================="
          ACR_PASSWORD=$(az acr credential show -n $(acrName) --query "passwords[0].value" -o tsv)
          kubectl delete secret acr-secret -n $(namespace) --ignore-not-found=true
          kubectl create secret docker-registry acr-secret \
            --docker-server=$(acrName).azurecr.io \
            --docker-username=$(acrName) \
            --docker-password=$ACR_PASSWORD \
            -n $(namespace)
          echo "✓ ACR secret configured"

          # Create Kubernetes secret from frontend-env
          echo ""
          echo "=========================================="
          echo "Creating Kubernetes Secret..."
          echo "=========================================="
          kubectl delete secret suanet-frontend-secret -n $(namespace) --ignore-not-found=true
          kubectl create secret generic suanet-frontend-secret \
            --from-env-file=$(Pipeline.Workspace)/frontend-env/frontend-env \
            -n $(namespace)
          echo "✓ Kubernetes secret created"

          # Update deployment with new image tag and version label
          echo ""
          echo "=========================================="
          echo "Updating Deployment Manifest..."
          echo "=========================================="
          cd $(Build.SourcesDirectory)

          # Update image tag in deployment.yaml
          sed -i "s|image: $(acrName).azurecr.io/suanet-frontend-prd:.*|image: $(acrName).azurecr.io/suanet-frontend-prd:$(imageTag)|g" k8s/prd/deployment.yaml

          # Update version label in pod template
          sed -i "s|version: \".*\"  # Auto-updated to 1.{BuildId}|version: \"$(versionLabel)\"  # Auto-updated to 1.{BuildId}|g" k8s/prd/deployment.yaml

          echo "Updated deployment.yaml:"
          grep -A 2 "image: $(acrName).azurecr.io" k8s/prd/deployment.yaml
          grep -A 1 "version:" k8s/prd/deployment.yaml | grep "Auto-updated" || true

          # Apply deployment
          echo ""
          echo "=========================================="
          echo "Applying Kubernetes Resources..."
          echo "=========================================="
          echo "Deploying frontend ingress (Azure Front Door compatible)..."
          kubectl apply -f k8s/prd/ingress.yaml
          echo "Deploying WebSocket ingress (Socket.IO support)..."
          kubectl apply -f k8s/prd/websocket-ingress.yaml
          echo "Deploying frontend service..."
          kubectl apply -f k8s/prd/service.yaml
          echo "Deploying frontend application..."
          kubectl apply -f k8s/prd/deployment.yaml

          # Wait for rollout
          echo ""
          echo "=========================================="
          echo "Waiting for Rollout..."
          echo "=========================================="
          kubectl rollout status deployment/suanet-frontend -n $(namespace) --timeout=5m

          # Verify deployment
          echo ""
          echo "=========================================="
          echo "Deployment Verification"
          echo "=========================================="
          echo "Pods:"
          kubectl get pods -n $(namespace) -l app=suanet-frontend
          echo ""
          echo "Service:"
          kubectl get svc -n $(namespace) -l app=suanet-frontend
          echo ""
          echo "Recent Events:"
          kubectl get events -n $(namespace) --sort-by='.lastTimestamp' | head -20

          # Extract and display logs
          echo ""
          echo "=========================================="
          echo "Application Logs (last 50 lines)"
          echo "=========================================="
          kubectl logs -n $(namespace) -l app=suanet-frontend --tail=50 || true

          echo ""
          echo "=========================================="
          echo "✓ Deployment completed successfully"
          echo "=========================================="
